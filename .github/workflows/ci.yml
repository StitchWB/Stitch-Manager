name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch/PR when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend tests (Jest)
        run: npx jest --no-coverage --passWithNoTests

      - name: Lint
        run: npm run lint --if-present

      - name: Build frontend
        run: npm run build

  python:
    name: Python Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements*.txt

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Zone boundary check (leak guard)
        run: python scripts/check_zone_boundary.py

      - name: Ruff check
        run: ruff check .

      - name: Mypy check
        run: mypy stitch_backend
