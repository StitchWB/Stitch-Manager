[project]
name = "stitch-backend"
version = "0.2.0"
description = "Stitch Manager v2 — Python backend (FastAPI + SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stitch Team" }]

dependencies = [
    # ── Web framework ──────────────────────────────────────────────────────
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",

    # ── Database ───────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",

    # ── Validation & config ───────────────────────────────────────────────
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # ── HTTP client ──────────────────────────────────────────────────
    "httpx>=0.27.0",
    "socksio>=1.0.0",  # SOCKS5 proxy support for httpx

    # ── Optional LiteLLM gateway ───────────────────────────────────────────
    "litellm[proxy]>=1.93.0,<2.0.0",

    # ── Utilities ──────────────────────────────────────────────────────────
    "aiofiles>=24.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "keyring>=25.0.0",

    # ── CLI / MCP ───────────────────────────────────────────────────────────
    "typer>=0.9.0",
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
autoreg = [
    "DrissionPage>=4.0.0",
    "aioimaplib>=1.1.0",
    "authlib>=1.3.0",
]
desktop = [
    "pywebview>=5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=0.5.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.0.0",
    "httpx>=0.27.0",       # TestClient async
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-aiofiles>=24.0.0",
    # browser automation — needed by tests/browser/**
    "DrissionPage>=4.0.0",
    "aioimaplib>=1.1.0",
    "authlib>=1.3.0",
    # imported at module level by non-browser tests (cdp attachment, deepseek
    # adapter, engine-pack wasm) - required for a green full-suite run
    "playwright>=1.40.0",
    "wasmtime>=15.0.0",
    "curl_cffi>=0.7.0",
    # imported at module level by tests/stitch_bot/** and test_auto_subscribe
    # (aiogram), and by the TOTP SPI at runtime (pyotp)
    "aiogram>=3.0.0",
    "pyotp>=2.9.0",
]

[project.scripts]
stitch-backend = "stitch_backend.main:run"
stitch = "stitch_backend.cli.main:app"
stitch-mcp = "stitch_backend.mcp_server.server:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["stitch_backend*", "stitch_plugin_tools*", "stitch_plugin_testing*", "autoreg*"]

# ── Tool config ──────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
# TODO(debt): remove tests exclude once test ruff errors are cleaned up
# "q*" excludes Zone-3 research dirs (qoder_*) without naming them in this
# file — the leak-guard pattern matches the literal Zone-3 directory name.
# deepseek_vendor / turnstile-solver = pinned upstream code (vendored as-is)
extend-exclude = ["tests", "q*", "*deepseek_vendor*", "*turnstile-solver*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "TCH"]
# E402: Module level import not at top (intentional for path setup in entry point scripts)
# E501: Line too long (handled by formatter)
# B008: FastAPI Depends() in function defaults (correct FastAPI pattern)
# N815: mixedCase in Pydantic models (required for API compatibility - camelCase JSON)
# N818: domain exceptions keep semantic names without the Error suffix
#       (PluginCallTimeout, PluginNotRunning, SpiNotRegistered) - they are
#       public plugin-SDK surface caught by name in dual modules and tests.
# B017: pytest.raises(Exception) in tests (acceptable for broad error testing)
ignore = ["E501", "E402", "B008", "N815", "N818", "B017"]

[tool.ruff.lint.isort]
# stitch_bot is a private sibling package (Telegram bot) that the open-core
# client imports only opportunistically (function-level, try-guarded). It is
# absent from this client-only distribution, so declare it first-party
# explicitly to keep the optional-import blocks' sorting stable (else ruff
# treats it as third-party and flags I001 against the intended layout).
known-first-party = ["stitch_bot"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
check_untyped_defs = true
follow_imports = "silent"
# Do NOT ignore missing imports globally — catches bad module names (e.g. stitch_backend.db)
ignore_missing_imports = false

# Third-party libs without stubs: silence only those, never our own packages
[[tool.mypy.overrides]]
module = [
    "DrissionPage.*",
    "psutil.*",
    "aiohttp.*",
    "uvicorn.*",
    "aioimaplib.*",
    "google.auth.*",
    "google.oauth2.*",
    "webview",
    "shardx",
    "pyotp",
    "aiogram.*",
    "autoreg.browser.*",
    "autoreg.spoofers.*",
    "autoreg.services.*",
    "autoreg.email_providers.*",
    "autoreg.pipeline.*",
]
ignore_missing_imports = true

# numpy stubs use Python 3.12 syntax incompatible with our 3.11 target
[[tool.mypy.overrides]]
module = "numpy.*"
ignore_errors = true

# deepseek_vendor = pinned upstream code (vendored as-is, same as the ruff
# extend-exclude) - do not type-check third-party internals.
[[tool.mypy.overrides]]
module = "stitch_backend.domains.ai_proxy.web.deepseek_vendor.*"
ignore_errors = true

# Zone-2 registration methods (autoreg.providers / autoreg.captcha) and the
# private Telegram bot (stitch_bot) are NOT part of the open-core client.
# Zone-1 code imports them only opportunistically (function-level, try-guarded)
# and degrades gracefully when they are absent, so silence the resulting
# missing-import errors for this client-only tree.
[[tool.mypy.overrides]]
module = [
    "autoreg.providers.*",
    "autoreg.captcha.*",
    "stitch_bot.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Per-test hang guard. Budget covers the slowest legitimate lifecycle tests.
# timeout_method is deliberately left at the plugin default: 'signal' on
# POSIX, which fails the single timed-out test cleanly and lets the suite
# continue. The previously pinned 'thread' method must NOT come back: on
# timeout it dumps stacks and calls os._exit(1), killing the WHOLE pytest
# process with no summary — one slow test nuked the entire CI run.
timeout = 90
