[project]
name = "stitch-backend"
version = "0.2.0"
description = "Stitch Manager v2 — Python backend (FastAPI + SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stitch Team" }]

dependencies = [
    # ── Web framework ──────────────────────────────────────────────────────
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",

    # ── Database ───────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",

    # ── Validation & config ───────────────────────────────────────────────
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # ── HTTP client ──────────────────────────────────────────────────
    "httpx>=0.27.0",
    "socksio>=1.0.0",  # SOCKS5 proxy support for httpx

    # ── Optional LiteLLM gateway ───────────────────────────────────────────
    "litellm[proxy]>=1.93.0,<2.0.0",

    # ── Utilities ──────────────────────────────────────────────────────────
    "aiofiles>=24.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "keyring>=25.0.0",

    # ── CLI / MCP ───────────────────────────────────────────────────────────
    "typer>=0.9.0",
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
autoreg = [
    "DrissionPage>=4.0.0",
    "aioimaplib>=1.1.0",
    "authlib>=1.3.0",
]
desktop = [
    "pywebview>=5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=0.5.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.0.0",
    "httpx>=0.27.0",       # TestClient async
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-aiofiles>=24.0.0",
    # browser automation — needed by tests/browser/**
    "DrissionPage>=4.0.0",
    "aioimaplib>=1.1.0",
    "authlib>=1.3.0",
]

[project.scripts]
stitch-backend = "stitch_backend.main:run"
stitch-desktop = "stitch_backend.desktop:main"
stitch = "stitch_backend.cli.main:app"
stitch-mcp = "stitch_backend.mcp_server.server:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["stitch_backend*"]

# ── Tool config ──────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
# TODO(debt): remove tests exclude once test ruff errors are cleaned up
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "TCH"]
# E402: Module level import not at top (intentional for path setup in entry point scripts)
# E501: Line too long (handled by formatter)
# B008: FastAPI Depends() in function defaults (correct FastAPI pattern)
# N815: mixedCase in Pydantic models (required for API compatibility - camelCase JSON)
# B017: pytest.raises(Exception) in tests (acceptable for broad error testing)
ignore = ["E501", "E402", "B008", "N815", "B017"]

[tool.ruff.lint.per-file-ignores]
# qoder_bypass uses standard cryptographic notation (H0-H7, K, W, S0, S1 for SHA-512)
"qoder_bypass/**/*.py" = ["N806"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
check_untyped_defs = true
follow_imports = "silent"
# Do NOT ignore missing imports globally — catches bad module names (e.g. stitch_backend.db)
ignore_missing_imports = false

# Third-party libs without stubs: silence only those, never our own packages
[[tool.mypy.overrides]]
module = [
    "DrissionPage.*",
    "psutil.*",
    "aiohttp.*",
    "uvicorn.*",
    "aioimaplib.*",
    "google.auth.*",
    "google.oauth2.*",
    "webview",
    "shardx",
    "autoreg.browser.*",
    "autoreg.spoofers.*",
    "autoreg.services.*",
    "autoreg.email_providers.*",
    "autoreg.pipeline.*",
]
ignore_missing_imports = true

# numpy stubs use Python 3.12 syntax incompatible with our 3.11 target
[[tool.mypy.overrides]]
module = "numpy.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
timeout = 10
timeout_method = "thread"
